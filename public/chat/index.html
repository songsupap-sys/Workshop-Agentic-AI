<!doctype html>
<html lang="th"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>AI Desk — Chat</title>
<style>:root{font-family:system-ui,sans-serif;color:#172033;background:#f4f7fb}body{margin:0 auto;max-width:900px;padding:20px}.top{display:flex;align-items:center;justify-content:space-between}.top a{color:#4f46e5;text-decoration:none}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.controls label{display:flex;flex-direction:column;gap:5px;font-size:.9rem;color:#526078}select,input,textarea,button{font:inherit;border:1px solid #d5dce8;border-radius:10px;padding:10px;background:#fff}select,input{min-width:180px}.messages{min-height:55vh;background:#fff;border-radius:16px;padding:18px;box-shadow:0 8px 28px #26385914;overflow:auto}.bubble{max-width:78%;margin:10px 0;padding:11px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}.user{margin-left:auto;background:#4f46e5;color:#fff}.assistant{background:#eef2f8}.composer{display:flex;gap:10px;margin-top:14px}.composer textarea{flex:1;resize:vertical;min-height:48px}.composer button{background:#4f46e5;color:#fff;border:0;padding:0 20px;cursor:pointer}.composer button:disabled{opacity:.6}.empty{text-align:center;color:#7b879b;margin-top:25vh}</style></head>
<body><header class="top"><h1>💬 Chat</h1><a href="/">← Portal</a></header>
<section class="controls"><label>Provider<select id="provider"><option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="openai-compat">Custom gateway</option></select></label><label>Model<input id="model" placeholder="ใช้ค่า default จากระบบ" /></label></section>
<main id="messages" class="messages"><div class="empty">เริ่มสนทนาด้วยการพิมพ์ข้อความด้านล่าง</div></main><form id="composer" class="composer"><textarea id="message" placeholder="พิมพ์ข้อความ..." required rows="2"></textarea><button type="submit">ส่ง</button></form><script src="/chat/app.js"></script></body></html>
